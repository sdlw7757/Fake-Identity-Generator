name: Deploy to GitHub Pages

# 触发条件：
# 1. 推送到 main 分支时自动构建并部署
# 2. 在 Actions 页面手动触发（支持「自动更新」场景，例如定时拉取最新姓名库后重新构建）
on:
  push:
    branches: [main, master]
  schedule:
    # 每周一 UTC 00:00 自动重建一次，确保部署产物与依赖保持最新
    - cron: '0 0 * * 1'
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署到 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务；不取消正在进行的正式部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 package.json 的 packageManager / 本地开发保持一致。
          # pnpm-workspace.yaml 使用的 allowBuilds 需要 pnpm 10+。
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 要求 Node ^22.22.2 || ^24.15.0 || >=26，因此不能用 Node 20。
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate & Build
        # check = 生成数据入口 → 数据/引擎自检 → vite build → 界面冒烟测试
        # 任何一步失败都不会部署，避免把坏数据发布上线。
        run: pnpm run check

      - name: Add .nojekyll
        # 阻止 GitHub Pages 的 Jekyll 处理，避免下划线开头的资源被忽略
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
